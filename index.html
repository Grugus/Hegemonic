<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sonic Turbo Dash 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05070f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            max-width: 480px; 
            max-height: 854px; 
            background: #4ab3ff; 
            overflow: hidden; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        .ui-screen { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 40px 20px; 
            background: rgba(5, 12, 28, 0.85); 
            backdrop-filter: blur(10px); 
            color: #fff; 
            z-index: 20; 
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 26px; font-weight: 900; color: #00e5ff; text-shadow: 0 0 15px #00e5ff; text-align: center; letter-spacing: 1px; }
        
        .char-selector { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding: 10px 0; }
        .char-card { 
            flex: 0 0 90px; 
            height: 110px; 
            background: #12192c; 
            border: 2px solid #2d3b61; 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: 0.15s; 
        }
        .char-card.selected { border-color: #00ff88; box-shadow: 0 0 18px #00ff88; background: #1a2a4a; transform: scale(1.05); }
        
        .btn { 
            background: linear-gradient(45deg, #ff0055, #ff5500); 
            border: none; 
            padding: 16px 45px; 
            color: white; 
            font-size: 20px; 
            font-weight: 800; 
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.5); 
            text-transform: uppercase; 
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        
        #hud { 
            position: absolute; 
            top: 20px; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            padding: 0 20px; 
            color: #fff; 
            font-size: 18px; 
            font-weight: 900; 
            pointer-events: none; 
            z-index: 10; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); 
        }

        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 15;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            touch-action: manipulation;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: rgba(0, 229, 255, 0.6);
            transform: scale(0.90);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <canvas id="canvas3d"></canvas>
    
    <div id="hud">
        <div id="scoreDisplay">SCORE: 0</div>
        <div id="ringsDisplay" style="color: #ffd700;">RINGS: 0</div>
    </div>

    <div id="touch-controls">
        <div class="ctrl-btn" id="btnLeft">⬅</div>
        <div class="ctrl-btn" id="btnJump" style="width: 80px; height: 80px; background: rgba(0,229,255,0.4);">⬆</div>
        <div class="ctrl-btn" id="btnRight">➡</div>
    </div>

    <div id="menuScreen" class="ui-screen">
        <h1>TURBO DASH 3D<br><span style="font-size: 14px; color: #ff0055;">SONIC RUNNER</span></h1>
        
        <div style="width: 100%; text-align: center;">
            <p style="margin-bottom: 12px; color: #a0c0f0; font-size: 13px;">SELECT YOUR CHAMPION</p>
            <div class="char-selector" id="charContainer"></div>
        </div>

        <button class="btn" id="startBtn">START RACE</button>
    </div>

    <div id="gameOverScreen" class="ui-screen hidden">
        <h1>GAME OVER</h1>
        <div style="text-align: center; font-size: 24px;">
            <p id="finalScore">SCORE: 0</p>
            <p id="finalRings" style="color: #ffd700; margin-top: 8px;">RINGS: 0</p>
        </div>
        <button class="btn" id="retryBtn">RETRY</button>
    </div>
</div>

<script>
// --- AUDIO SYNTHESIZER ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'ring') {
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

// --- 3D ENGINE CLASS ---
class Engine3D {
    constructor() {
        this.container = document.getElementById('game-container');
        this.canvas = document.getElementById('canvas3d');
        
        this.characters = [
            { id: 'sonic', name: 'SONIC', color: 0x0055ff, shoeColor: 0xdd1111, speed: 1.25 },
            { id: 'shadow', name: 'SHADOW', color: 0x222222, shoeColor: 0xff2200, speed: 1.20 },
            { id: 'tails', name: 'TAILS', color: 0xffaa00, shoeColor: 0xdd1111, speed: 1.00 },
            { id: 'knuckles', name: 'KNUCKLES', color: 0xee1122, shoeColor: 0xffcc00, speed: 1.10 },
            { id: 'amy', name: 'AMY', color: 0xff55aa, shoeColor: 0xdd1155, speed: 1.05 }
        ];
        this.selectedChar = 0;
        this.state = 'MENU';

        // Tightened Lanes to keep completely within screen bounds
        this.lanes = [-2.1, 0, 2.1];
        this.currentLane = 1;
        this.gameSpeed = 0.85;
        this.score = 0;
        this.rings = 0;

        this.initScene();
        this.initControls();
        this.renderUI();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x4ab3ff);
        this.scene.fog = new THREE.FogExp2(0x82d0ff, 0.008);

        // Optimal FOV & Position to prevent off-screen clipping
        this.camera = new THREE.PerspectiveCamera(65, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
        this.camera.position.set(0, 5.2, 8.5);
        this.camera.lookAt(0, 1.5, -12);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.95);
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
        sunLight.position.set(12, 25, 15);
        this.scene.add(ambient, sunLight);

        // World & Track
        const grassGeo = new THREE.PlaneGeometry(160, 400);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3db83a, roughness: 0.8 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.set(0, -0.1, -100);
        this.scene.add(grass);

        const trackGeo = new THREE.PlaneGeometry(7.2, 400);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.5 });
        this.track = new THREE.Mesh(trackGeo, trackMat);
        this.track.rotation.x = -Math.PI / 2;
        this.track.position.set(0, 0, -100);
        this.scene.add(this.track);

        // Player Group
        this.playerGroup = new THREE.Group();
        this.scene.add(this.playerGroup);
        this.buildSonicCharacter();

        this.obstacles = [];
        this.collectibles = [];
        this.trees = [];

        for(let i = 0; i < 35; i++) {
            this.spawnTree((Math.random() > 0.5 ? 1 : -1) * (7 + Math.random() * 15), -Math.random() * 200);
        }
    }

    // --- SONIC-STYLE 3D CHARACTER MODEL BUILDER ---
    buildSonicCharacter() {
        while(this.playerGroup.children.length > 0) { 
            this.playerGroup.remove(this.playerGroup.children[0]); 
        }

        const charData = this.characters[this.selectedChar];
        const bodyGroup = new THREE.Group();

        // 1. Torso
        const bodyGeo = new THREE.SphereGeometry(0.55, 16, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        
        // Belly patch
        const bellyGeo = new THREE.SphereGeometry(0.38, 12, 12);
        const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffddaa });
        const belly = new THREE.Mesh(bellyGeo, bellyMat);
        belly.position.set(0, 0, -0.22);
        body.add(belly);

        // 2. Head
        const headGeo = new THREE.SphereGeometry(0.65, 20, 20);
        const headMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.2 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.45;

        // Muzzle
        const muzzleGeo = new THREE.SphereGeometry(0.38, 12, 12);
        const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xffddaa });
        const muzzle = new THREE.Mesh(muzzleGeo, muzzleMat);
        muzzle.position.set(0, -0.12, -0.35);
        head.add(muzzle);

        // Nose
        const noseGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const noseMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 0.05, -0.7);
        head.add(nose);

        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.2, 12, 12);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x00aa22 });

        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.16, 0.15, -0.48);
        const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), pupilMat);
        pupilL.position.set(0, 0, -0.14);
        eyeL.add(pupilL);

        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.16, 0.15, -0.48);
        const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), pupilMat);
        pupilR.position.set(0, 0, -0.14);
        eyeR.add(pupilR);

        head.add(eyeL, eyeR);

        // 3. Sonic Head Spikes / Quills
        const spikeGeo = new THREE.ConeGeometry(0.28, 1.1, 12);
        const spikeMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.2 });

        for (let i = 0; i < 5; i++) {
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            if (i < 3) { // Top & Back Spikes
                spike.rotation.x = -Math.PI / 2.5;
                spike.position.set(0, 0.2 - (i * 0.25), 0.5 + (i * 0.2));
            } else { // Side Spikes
                const side = i === 3 ? 1 : -1;
                spike.rotation.x = -Math.PI / 3;
                spike.rotation.z = side * (Math.PI / 6);
                spike.position.set(side * 0.4, 0.1, 0.5);
            }
            head.add(spike);
        }

        // 4. White Gloves & Power Shoes
        const gloveGeo = new THREE.SphereGeometry(0.2, 10, 10);
        const gloveMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

        const gloveL = new THREE.Mesh(gloveGeo, gloveMat);
        gloveL.position.set(-0.6, 0.8, 0);
        const gloveR = new THREE.Mesh(gloveGeo, gloveMat);
        gloveR.position.set(0.6, 0.8, 0);
        bodyGroup.add(gloveL, gloveR);

        const shoeGeo = new THREE.BoxGeometry(0.35, 0.35, 0.7);
        const shoeMat = new THREE.MeshStandardMaterial({ color: charData.shoeColor, roughness: 0.2 });

        const shoeL = new THREE.Mesh(shoeGeo, shoeMat);
        shoeL.position.set(-0.3, 0.2, -0.1);
        const shoeR = new THREE.Mesh(shoeGeo, shoeMat);
        shoeR.position.set(0.3, 0.2, -0.1);

        bodyGroup.add(body, head, shoeL, shoeR);

        this.playerMeshAnim = bodyGroup;
        this.playerGroup.add(bodyGroup);
        this.playerGroup.position.set(this.lanes[1], 0, 0);
    }

    spawnTree(x, z) {
        const treeGroup = new THREE.Group();
        
        const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 2.8, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1.4;

        const leavesGeo = new THREE.ConeGeometry(1.8, 4, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e8228, roughness: 0.6 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 3.6;

        treeGroup.add(trunk, leaves);
        treeGroup.position.set(x, 0, z);
        this.scene.add(treeGroup);
        this.trees.push(treeGroup);
    }

    initControls() {
        const moveLeft = () => { if (this.state === 'PLAYING' && this.currentLane > 0) this.currentLane--; };
        const moveRight = () => { if (this.state === 'PLAYING' && this.currentLane < 2) this.currentLane++; };
        const jump = () => { 
            if (this.state === 'PLAYING' && !this.isJumping) { 
                this.isJumping = true; 
                this.jumpVel = 0.38; 
            } 
        };

        // Pointer listeners for instant responsiveness
        document.getElementById('btnLeft').addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('btnRight').addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight(); });
        document.getElementById('btnJump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

        let startX = 0, startY = 0;
        window.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (this.state !== 'PLAYING') return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 25) moveRight();
                else if (dx < -25) moveLeft();
            } else {
                if (dy < -25) jump();
            }
        }, { passive: true });

        document.getElementById('startBtn').addEventListener('pointerdown', () => { initAudio(); this.start(); });
        document.getElementById('retryBtn').addEventListener('pointerdown', () => { initAudio(); this.showMenu(); });
    }

    renderUI() {
        const charContainer = document.getElementById('charContainer');
        charContainer.innerHTML = '';
        this.characters.forEach((char, i) => {
            const card = document.createElement('div');
            card.className = `char-card ${i === this.selectedChar ? 'selected' : ''}`;
            card.onclick = () => {
                this.selectedChar = i;
                this.renderUI();
                this.buildSonicCharacter();
            };
            card.innerHTML = `
                <div style="width: 35px; height: 35px; border-radius: 50%; background: #${char.color.toString(16).padStart(6, '0')}; margin-bottom: 6px; border: 2px solid #${char.shoeColor.toString(16).padStart(6, '0')}"></div>
                <div style="font-weight:bold; font-size: 11px; color: #fff;">${char.name}</div>
            `;
            charContainer.appendChild(card);
        });
    }

    spawnEntities() {
        if (Math.random() < 0.05) {
            const lane = Math.floor(Math.random() * 3);
            const isObs = Math.random() > 0.45;

            if (isObs) {
                const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                const mat = new THREE.MeshStandardMaterial({ color: 0xd9381e, roughness: 0.3 });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(this.lanes[lane], 0.6, -120);
                this.scene.add(obs);
                this.obstacles.push(obs);
            } else {
                const geo = new THREE.TorusGeometry(0.5, 0.12, 16, 24);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                const ring = new THREE.Mesh(geo, mat);
                ring.position.set(this.lanes[lane], 1.0, -120);
                this.scene.add(ring);
                this.collectibles.push(ring);
            }
        }
    }

    start() {
        this.score = 0;
        this.rings = 0;
        this.gameSpeed = 0.85 * this.characters[this.selectedChar].speed;
        this.currentLane = 1;
        this.state = 'PLAYING';

        this.obstacles.forEach(o => this.scene.remove(o));
        this.collectibles.forEach(c => this.scene.remove(c));
        this.obstacles = [];
        this.collectibles = [];

        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    gameOver() {
        playSound('hit');
        this.state = 'GAMEOVER';
        document.getElementById('finalScore').innerText = `SCORE: ${Math.floor(this.score)}`;
        document.getElementById('finalRings').innerText = `RINGS: ${this.rings}`;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    showMenu() {
        this.state = 'MENU';
        document.getElementById('menuScreen').classList.remove('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    animate() {
        requestAnimationFrame(this.animate);

        if (this.state === 'PLAYING') {
            this.score += this.gameSpeed * 0.2;
            this.gameSpeed += 0.00015;

            // Constrained Lane Physics (Never Off-Screen)
            const targetX = this.lanes[this.currentLane];
            this.playerGroup.position.x += (targetX - this.playerGroup.position.x) * 0.25;
            this.playerGroup.rotation.z = (this.playerGroup.position.x - targetX) * 0.10;

            // Running Animation (Sonic Lean & Stride)
            if (this.playerMeshAnim && !this.isJumping) {
                this.playerMeshAnim.rotation.x = -0.15 + Math.sin(Date.now() * 0.02) * 0.08;
                this.playerMeshAnim.position.y = Math.abs(Math.sin(Date.now() * 0.025)) * 0.15;
            }

            // Jump Physics
            if (this.isJumping) {
                this.playerGroup.position.y += this.jumpVel;
                this.jumpVel -= 0.024;
                if (this.playerMeshAnim) this.playerMeshAnim.rotation.x += 0.25; // Spin jump

                if (this.playerGroup.position.y <= 0) {
                    this.playerGroup.position.y = 0;
                    this.isJumping = false;
                }
            }

            this.spawnEntities();

            // Trees Recycling
            this.trees.forEach(tree => {
                tree.position.z += this.gameSpeed;
                if (tree.position.z > 20) tree.position.z = -180;
            });

            // Obstacles
            for (let i = this.obstacles.length - 1; i >= 0; i--) {
                let obs = this.obstacles[i];
                obs.position.z += this.gameSpeed;
                obs.rotation.y += 0.03;

                if (this.playerGroup.position.distanceTo(obs.position) < 1.3) {
                    this.gameOver();
                }
                if (obs.position.z > 10) {
                    this.scene.remove(obs);
                    this.obstacles.splice(i, 1);
                }
            }

            // Collectibles
            for (let i = this.collectibles.length - 1; i >= 0; i--) {
                let ring = this.collectibles[i];
                ring.position.z += this.gameSpeed;
                ring.rotation.y += 0.08;

                if (this.playerGroup.position.distanceTo(ring.position) < 1.2) {
                    this.rings++;
                    playSound('ring');
                    this.scene.remove(ring);
                    this.collectibles.splice(i, 1);
                    continue;
                }
                if (ring.position.z > 10) {
                    this.scene.remove(ring);
                    this.collectibles.splice(i, 1);
                }
            }

            document.getElementById('scoreDisplay').innerText = `SCORE: ${Math.floor(this.score)}`;
            document.getElementById('ringsDisplay').innerText = `RINGS: ${this.rings}`;
        }

        this.renderer.render(this.scene, this.camera);
    }
}

window.onload = () => { window.gameEngine = new Engine3D(); };
</script>
</body>
</html>
