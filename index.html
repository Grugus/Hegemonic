<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sonic Turbo Dash 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05070f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
        
        /* Fixed Aspect Ratio Game Container */
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            max-width: 540px; 
            max-height: 960px; 
            background: #4ab3ff; 
            overflow: hidden; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        .ui-screen { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 40px 20px; 
            background: rgba(5, 12, 28, 0.82); 
            backdrop-filter: blur(10px); 
            color: #fff; 
            z-index: 20; 
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 28px; font-weight: 900; color: #00e5ff; text-shadow: 0 0 15px #00e5ff; text-align: center; letter-spacing: 1px; }
        
        .char-selector { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding: 10px 0; }
        .char-card { 
            flex: 0 0 90px; 
            height: 110px; 
            background: #12192c; 
            border: 2px solid #2d3b61; 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: 0.15s; 
        }
        .char-card.selected { border-color: #00ff88; box-shadow: 0 0 18px #00ff88; background: #1a2a4a; transform: scale(1.05); }
        
        .btn { 
            background: linear-gradient(45deg, #ff0055, #ff5500); 
            border: none; 
            padding: 16px 45px; 
            color: white; 
            font-size: 20px; 
            font-weight: 800; 
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.5); 
            text-transform: uppercase; 
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        
        #hud { 
            position: absolute; 
            top: 20px; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            padding: 0 20px; 
            color: #fff; 
            font-size: 20px; 
            font-weight: 900; 
            pointer-events: none; 
            z-index: 10; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); 
        }

        /* On-Screen Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 15;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            touch-action: manipulation;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: rgba(0, 229, 255, 0.6);
            transform: scale(0.90);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <canvas id="canvas3d"></canvas>
    
    <div id="hud">
        <div id="scoreDisplay">SCORE: 0</div>
        <div id="ringsDisplay" style="color: #ffd700;">RINGS: 0</div>
    </div>

    <div id="touch-controls">
        <div class="ctrl-btn" id="btnLeft">⬅</div>
        <div class="ctrl-btn" id="btnJump" style="width: 85px; height: 85px; background: rgba(0,229,255,0.4);">⬆</div>
        <div class="ctrl-btn" id="btnRight">➡</div>
    </div>

    <div id="menuScreen" class="ui-screen">
        <h1>TURBO DASH 3D<br><span style="font-size: 14px; color: #ff0055;">JUNGLE RUNNER</span></h1>
        
        <div style="width: 100%; text-align: center;">
            <p style="margin-bottom: 12px; color: #a0c0f0; font-size: 13px;">SELECT YOUR CHAMPION</p>
            <div class="char-selector" id="charContainer"></div>
        </div>

        <button class="btn" id="startBtn">START RACE</button>
    </div>

    <div id="gameOverScreen" class="ui-screen hidden">
        <h1>GAME OVER</h1>
        <div style="text-align: center; font-size: 24px;">
            <p id="finalScore">SCORE: 0</p>
            <p id="finalRings" style="color: #ffd700; margin-top: 8px;">RINGS: 0</p>
        </div>
        <button class="btn" id="retryBtn">RETRY</button>
    </div>
</div>

<script>
// --- AUDIO SYNTHESIZER ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'ring') {
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

// --- 3D ENGINE CLASS ---
class Engine3D {
    constructor() {
        this.container = document.getElementById('game-container');
        this.canvas = document.getElementById('canvas3d');
        
        this.characters = [
            { id: 'aero', name: 'AERO', color: 0x0077ff, earColor: 0x0044aa, speed: 1.2 },
            { id: 'kira', name: 'KIRA', color: 0xbb33ff, earColor: 0xffcc00, speed: 1.0 },
            { id: 'roco', name: 'ROCO', color: 0xff8800, earColor: 0x663300, speed: 0.9 },
            { id: 'luna', name: 'LUNA', color: 0x22cc55, earColor: 0x88ffaa, speed: 1.0 },
            { id: 'blaze', name: 'BLAZE', color: 0xff1133, earColor: 0xffaa00, speed: 1.3 }
        ];
        this.selectedChar = 0;
        this.state = 'MENU';

        this.lanes = [-3.0, 0, 3.0];
        this.currentLane = 1;
        this.gameSpeed = 0.85;
        this.score = 0;
        this.rings = 0;

        this.initScene();
        this.initControls();
        this.renderUI();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x4ab3ff); // Bright Sky Blue
        this.scene.fog = new THREE.FogExp2(0x82d0ff, 0.008);

        // Fixed Aspect Camera to prevent track clipping
        this.camera = new THREE.PerspectiveCamera(55, 540 / 960, 0.1, 1000);
        this.camera.position.set(0, 6, 11);
        this.camera.lookAt(0, 1.8, -12);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(540, 960);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Bright Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.9);
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
        sunLight.position.set(15, 30, 20);
        this.scene.add(ambient, sunLight);

        // Green Grass World
        const grassGeo = new THREE.PlaneGeometry(200, 400);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3db83a, roughness: 0.8 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.set(0, -0.1, -100);
        this.scene.add(grass);

        // Wooden Race Track Path
        const trackGeo = new THREE.PlaneGeometry(10, 400);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.5 });
        this.track = new THREE.Mesh(trackGeo, trackMat);
        this.track.rotation.x = -Math.PI / 2;
        this.track.position.set(0, 0, -100);
        this.scene.add(this.track);

        // Player Group
        this.playerGroup = new THREE.Group();
        this.scene.add(this.playerGroup);
        this.buildCharacterMesh();

        this.obstacles = [];
        this.collectibles = [];
        this.trees = [];

        // Environment Trees
        for(let i = 0; i < 40; i++) {
            this.spawnTree((Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 20), -Math.random() * 200);
        }
    }

    // Full 3D Character Model Construction
    buildCharacterMesh() {
        while(this.playerGroup.children.length > 0) { 
            this.playerGroup.remove(this.playerGroup.children[0]); 
        }

        const charData = this.characters[this.selectedChar];

        // Body
        const bodyGeo = new THREE.CylinderGeometry(0.7, 0.5, 1.4, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;

        // Head
        const headGeo = new THREE.SphereGeometry(0.65, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: charData.color, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.2;
        body.add(head);

        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.22, 0.1, -0.5);
        const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), pupilMat);
        pupilL.position.set(0, 0, -0.1);
        eyeL.add(pupilL);

        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.22, 0.1, -0.5);
        const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), pupilMat);
        pupilR.position.set(0, 0, -0.1);
        eyeR.add(pupilR);

        head.add(eyeL, eyeR);

        // Ears / Crest
        const earGeo = new THREE.ConeGeometry(0.25, 0.7, 8);
        const earMat = new THREE.MeshStandardMaterial({ color: charData.earColor });
        
        const earL = new THREE.Mesh(earGeo, earMat);
        earL.position.set(-0.35, 0.65, 0);
        earL.rotation.z = 0.3;
        
        const earR = new THREE.Mesh(earGeo, earMat);
        earR.position.set(0.35, 0.65, 0);
        earR.rotation.z = -0.3;

        head.add(earL, earR);

        this.playerMeshAnim = body;
        this.playerGroup.add(body);
        this.playerGroup.position.set(this.lanes[1], 0, 0);
    }

    spawnTree(x, z) {
        const treeGroup = new THREE.Group();
        
        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1.5;

        const leavesGeo = new THREE.ConeGeometry(2, 4.5, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e8228, roughness: 0.6 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 4.0;

        treeGroup.add(trunk, leaves);
        treeGroup.position.set(x, 0, z);
        this.scene.add(treeGroup);
        this.trees.push(treeGroup);
    }

    initControls() {
        const moveLeft = () => { if (this.state === 'PLAYING' && this.currentLane > 0) this.currentLane--; };
        const moveRight = () => { if (this.state === 'PLAYING' && this.currentLane < 2) this.currentLane++; };
        const jump = () => { 
            if (this.state === 'PLAYING' && !this.isJumping) { 
                this.isJumping = true; 
                this.jumpVel = 0.38; 
            } 
        };

        // Zero-delay Pointer Events for Control Buttons
        document.getElementById('btnLeft').addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('btnRight').addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight(); });
        document.getElementById('btnJump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

        // Touch Swipes
        let startX = 0, startY = 0;
        window.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (this.state !== 'PLAYING') return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 25) moveRight();
                else if (dx < -25) moveLeft();
            } else {
                if (dy < -25) jump();
            }
        }, { passive: true });

        document.getElementById('startBtn').addEventListener('pointerdown', () => { initAudio(); this.start(); });
        document.getElementById('retryBtn').addEventListener('pointerdown', () => { initAudio(); this.showMenu(); });
    }

    renderUI() {
        const charContainer = document.getElementById('charContainer');
        charContainer.innerHTML = '';
        this.characters.forEach((char, i) => {
            const card = document.createElement('div');
            card.className = `char-card ${i === this.selectedChar ? 'selected' : ''}`;
            card.onclick = () => {
                this.selectedChar = i;
                this.renderUI();
                this.buildCharacterMesh();
            };
            card.innerHTML = `
                <div style="width: 35px; height: 35px; border-radius: 50%; background: #${char.color.toString(16).padStart(6, '0')}; margin-bottom: 6px;"></div>
                <div style="font-weight:bold; font-size: 12px; color: #fff;">${char.name}</div>
            `;
            charContainer.appendChild(card);
        });
    }

    spawnEntities() {
        if (Math.random() < 0.05) {
            const lane = Math.floor(Math.random() * 3);
            const isObs = Math.random() > 0.4;

            if (isObs) {
                const geo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
                const mat = new THREE.MeshStandardMaterial({ color: 0xd9381e, roughness: 0.3 });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(this.lanes[lane], 0.7, -120);
                this.scene.add(obs);
                this.obstacles.push(obs);
            } else {
                const geo = new THREE.TorusGeometry(0.55, 0.12, 16, 24);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                const ring = new THREE.Mesh(geo, mat);
                ring.position.set(this.lanes[lane], 1.0, -120);
                this.scene.add(ring);
                this.collectibles.push(ring);
            }
        }
    }

    start() {
        this.score = 0;
        this.rings = 0;
        this.gameSpeed = 0.85 * this.characters[this.selectedChar].speed;
        this.currentLane = 1;
        this.state = 'PLAYING';

        this.obstacles.forEach(o => this.scene.remove(o));
        this.collectibles.forEach(c => this.scene.remove(c));
        this.obstacles = [];
        this.collectibles = [];

        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    gameOver() {
        playSound('hit');
        this.state = 'GAMEOVER';
        document.getElementById('finalScore').innerText = `SCORE: ${Math.floor(this.score)}`;
        document.getElementById('finalRings').innerText = `RINGS: ${this.rings}`;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    showMenu() {
        this.state = 'MENU';
        document.getElementById('menuScreen').classList.remove('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    animate() {
        requestAnimationFrame(this.animate);

        if (this.state === 'PLAYING') {
            this.score += this.gameSpeed * 0.2;
            this.gameSpeed += 0.00015;

            // Smooth Lane Interpolation
            const targetX = this.lanes[this.currentLane];
            this.playerGroup.position.x += (targetX - this.playerGroup.position.x) * 0.25;
            this.playerGroup.rotation.z = (this.playerGroup.position.x - targetX) * 0.12;

            // Running Animation Wobble
            if (this.playerMeshAnim && !this.isJumping) {
                this.playerMeshAnim.rotation.x = Math.sin(Date.now() * 0.015) * 0.1;
                this.playerMeshAnim.position.y = 1.0 + Math.abs(Math.sin(Date.now() * 0.02)) * 0.15;
            }

            // Jump Physics
            if (this.isJumping) {
                this.playerGroup.position.y += this.jumpVel;
                this.jumpVel -= 0.024;
                if (this.playerGroup.position.y <= 0) {
                    this.playerGroup.position.y = 0;
                    this.isJumping = false;
                }
            }

            this.spawnEntities();

            // Trees Recycling
            this.trees.forEach(tree => {
                tree.position.z += this.gameSpeed;
                if (tree.position.z > 20) tree.position.z = -180;
            });

            // Obstacles
            for (let i = this.obstacles.length - 1; i >= 0; i--) {
                let obs = this.obstacles[i];
                obs.position.z += this.gameSpeed;
                obs.rotation.y += 0.03;

                if (this.playerGroup.position.distanceTo(obs.position) < 1.4) {
                    this.gameOver();
                }
                if (obs.position.z > 10) {
                    this.scene.remove(obs);
                    this.obstacles.splice(i, 1);
                }
            }

            // Collectibles
            for (let i = this.collectibles.length - 1; i >= 0; i--) {
                let ring = this.collectibles[i];
                ring.position.z += this.gameSpeed;
                ring.rotation.y += 0.08;

                if (this.playerGroup.position.distanceTo(ring.position) < 1.3) {
                    this.rings++;
                    playSound('ring');
                    this.scene.remove(ring);
                    this.collectibles.splice(i, 1);
                    continue;
                }
                if (ring.position.z > 10) {
                    this.scene.remove(ring);
                    this.collectibles.splice(i, 1);
                }
            }

            document.getElementById('scoreDisplay').innerText = `SCORE: ${Math.floor(this.score)}`;
            document.getElementById('ringsDisplay').innerText = `RINGS: ${this.rings}`;
        }

        this.renderer.render(this.scene, this.camera);
    }
}

window.onload = () => { window.gameEngine = new Engine3D(); };
</script>
</body>
</html>
