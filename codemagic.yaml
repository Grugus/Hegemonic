workflows:
  android-apk-build:
    name: Build Android Debug APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Prepare Web Assets & Capacitor Config
        script: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/
          
      - name: Add Android Platform & Sync
        script: |
          npx cap add android
          
          # Copy custom app icon if present
          if [ -f "assets/icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          fi

          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
