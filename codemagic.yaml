workflows:
  android-apk-build:
    name: Build Android Debug APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      node: 18.16.0
      java: 17
    scripts:
      - name: Install Dependencies
        script: |
          npm install -g @capacitor/cli @capacitor/core
          npm init -y
          npm install @capacitor/android
          
      - name: Initialize Capacitor & Add Android
        script: |
          mkdir -p www
          cp index.html www/
          npx cap init "Sonic Turbo Dash 3D" "com.turbodash.game3d" --web-dir www
          npx cap add android
          
          # Copy custom icon if uploaded
          if [ -f "assets/icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          fi

          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
